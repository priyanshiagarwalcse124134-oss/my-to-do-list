<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1>My Tod-Do List</h1>

    <!-- The form lets the user add a task with the button or Enter. -->
    <form id="task-form">
      <label class="visually-hidden" for="task-input">Enter a task</label>
      <input id="task-input" type="text" placeholder="What do you need to do?" autocomplete="off">
      <button type="submit">Add Display</button>
    </form>

    <p id="remaining-count" class="remaining-count">0 tasks remaining</p>

    <!-- JavaScript adds task rows inside this list. -->
    <ul id="task-list" aria-label="Tasks"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
